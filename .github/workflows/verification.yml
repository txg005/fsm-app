name: Verification

on:
  pull_request:
  push:
    branches: [main, feature/ci-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15.10-bookworm
        env:
          POSTGRES_DB: fsm_ci
          POSTGRES_USER: fsm_ci
          # Public throwaway fixture, never a production credential.
          POSTGRES_PASSWORD: fsm-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsm_ci -d fsm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.properties
            backend/gradle/wrapper/*
      - name: Unit, real PostgreSQL integration, distribution
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fsm_ci
          TEST_DATABASE_USER: fsm_ci
          TEST_DATABASE_PASSWORD: fsm-ci-disposable-only
        run: sh gradlew --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process test integrationTest installDist --console=plain
      - name: Require executed backend suites
        run: python3 scripts/ci/check_reports.py backend
      - name: Preserve backend reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/build/reports/tests/
            backend/build/test-results/

  android:
    name: Android SDK36 build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradlew
      - name: Install pinned Android platform and build tools
        timeout-minutes: 10
        run: sh scripts/ci/android_sdk.sh
      - name: JVM tests, lint and both APKs
        working-directory: android
        run: sh gradlew --no-daemon --no-parallel --max-workers=1 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - name: Require executed Android JVM suite
        run: python3 scripts/ci/check_reports.py android
      - name: Preserve Android reports and APKs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-build-reports-apks
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/

  instrumentation:
    name: Android 14-test regression gate (API36)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradlew
      - name: Install pinned Android platform and build tools
        timeout-minutes: 10
        run: sh scripts/ci/android_sdk.sh
      - name: Enable and require hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Execute complete instrumentation suite
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: sh gradlew --no-daemon --no-parallel --max-workers=1 connectedDebugAndroidTest --console=plain
      - name: Require all 14 baseline tests executed without skips
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_reports.py instrumentation
      - name: Preserve device results and APKs even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-instrumentation-api36
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/

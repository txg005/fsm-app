name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15.10-bookworm
        env:
          POSTGRES_DB: fsm_ci
          POSTGRES_USER: fsm_ci
          # Public throwaway fixture, never a production credential.
          POSTGRES_PASSWORD: fsm-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsm_ci -d fsm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.properties
            backend/gradle/wrapper/*
      - name: Unit, real PostgreSQL integration, distribution
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fsm_ci
          TEST_DATABASE_USER: fsm_ci
          TEST_DATABASE_PASSWORD: fsm-ci-disposable-only
        run: sh gradlew --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process test integrationTest installDist --console=plain
      - name: Require executed backend suites
        run: python3 scripts/ci/check_reports.py backend
      - name: Preserve backend reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/build/reports/tests/
            backend/build/test-results/

  android:
    name: Android SDK36 build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradlew
      - name: Install pinned Android platform and build tools
        timeout-minutes: 10
        run: sh scripts/ci/android_sdk.sh
      - name: JVM tests, lint and both APKs
        working-directory: android
        run: sh gradlew --no-daemon --no-parallel --max-workers=1 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - name: Require executed Android JVM suite
        run: python3 scripts/ci/check_reports.py android
      - name: Preserve Android reports and APKs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-build-reports-apks
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/

  instrumentation:
    name: Android 21-case regression and process restart (API36)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradlew
      - name: Install pinned Android platform and build tools
        timeout-minutes: 10
        run: sh scripts/ci/android_sdk.sh
      - name: Enable and require hosted KVM
        shell: bash
        timeout-minutes: 3
        run: |
          stage() {
            local label="$1"
            shift
            echo "::notice::KVM preflight: starting $label"
            if timeout --kill-after=5s 30s "$@"; then
              echo "::notice::KVM preflight: passed $label"
            else
              local code=$?
              echo "::error::KVM preflight: failed $label (exit $code); hardware acceleration remains required"
              exit "$code"
            fi
          }
          stage 'character device /dev/kvm exists' test -c /dev/kvm
          stage 'device mode and ownership' stat -c '%A %U %G %t:%T' /dev/kvm
          stage 'noninteractive sudo' sudo -n true
          stage 'install udev rule' sudo -n tee /etc/udev/rules.d/99-kvm4all.rules <<< 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          stage 'reload udev rules' sudo -n udevadm control --reload-rules
          stage 'trigger KVM udev event' sudo -n udevadm trigger --name-match=kvm
          stage 'settle KVM udev event' sudo -n udevadm settle --timeout=20
          stage 'device mode after settle' stat -c '%A %U %G %t:%T' /dev/kvm
          stage 'runner read access to /dev/kvm' test -r /dev/kvm
          stage 'runner write access to /dev/kvm' test -w /dev/kvm
      - name: Execute ordinary suite and separate force-stop phases
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            sh gradlew --no-daemon --no-parallel --max-workers=1 connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.notClass=com.fsm.restart.ProcessRestartTest --console=plain
            bash ../scripts/ci/android_process_restart.sh
      - name: Require all 14 baseline tests executed without skips
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_reports.py instrumentation
      - name: Preserve device results and APKs even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-instrumentation-api36
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/
      - name: Preserve validated process restart proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-process-restart-api36
          retention-days: 7
          if-no-files-found: warn
          path: android/app/build/outputs/process-restart/*.json
